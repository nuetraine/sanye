(()=>{
'use strict';
// ================= 基础设定 =================

const RAMPS=[
 ['#020208','#060714','#0b0d22','#131634','#1d2048','#2b2f63','#454a8a'],
 ['#07060c','#14121f','#241f33','#383049','#524662','#73647f','#a493a8'],
 ['#06121a','#0f2f3f','#1a5466','#2f8a98','#5fc4c8','#aeeee8','#f2fffc'],
 ['#1a0904','#46170a','#83300f','#c55516','#f08a2a','#ffc66a','#fff2c8'],
 ['#1c0a06','#4a1c10','#7e3420','#b4533a','#d97757','#f0a07e','#ffd9c2'],
 ['#060a1c','#0f1d42','#1b3a6e','#2f63a0','#5b97cf','#a4cff0','#eef8ff'],
 ['#0c0808','#251a1c','#433034','#6a4b4f','#94706e','#c09c94','#ecd8cc'],

 ['#06101a','#10283c','#1f4a66','#357896','#62acc4','#a8dcea','#effcff'],

 ['#0a0a0e','#1c1d26','#34363f','#555865','#82879a','#b7bccc','#f0f3fa'],

 ['#100406','#2a0a10','#4a1018','#701a22','#9a2a2c','#c4463c','#e87a62'],
];
const RAMP32=new Uint32Array(RAMPS.length*7),RAMPRGB=new Float32Array(RAMPS.length*7*3);
RAMPS.forEach((r,m)=>r.forEach((h,i)=>{const v=parseInt(h.slice(1),16),R=v>>16,G=(v>>8)&255,B=v&255;
 RAMP32[m*7+i]=(255<<24)|(B<<16)|(G<<8)|R;RAMPRGB[(m*7+i)*3]=R;RAMPRGB[(m*7+i)*3+1]=G;RAMPRGB[(m*7+i)*3+2]=B;}));
const col32=h=>{const v=parseInt(h.slice(1),16);return (255<<24)|((v&255)<<16)|(((v>>8)&255)<<8)|(v>>16)};

// ================= 噪声 =================
function h1(i){i=Math.imul(i^0x27d4eb2d,0x165667b1);i^=i>>>15;i=Math.imul(i,0x85ebca6b);i^=i>>>13;i=Math.imul(i,0xc2b2ae35);i^=i>>>16;return (i>>>0)/4294967296}
function h2(x,y){return h1(Math.imul(x,374761393)+Math.imul(y,668265263))}
function n1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return h1(i)*(1-u)+h1(i+1)*u}
function n2(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 const a=h2(ix,iy),b=h2(ix+1,iy),c=h2(ix,iy+1),d=h2(ix+1,iy+1);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v}
function fbm(x,y){return n2(x,y)*0.5+n2(x*2.03,y*2.03)*0.25+n2(x*4.1,y*4.1)*0.15+n2(x*8.3,y*8.3)*0.1}

function glowAdd(sx,sy,m,l,g){const gx=sx>>2,gy=sy>>2;if(gx<0||gx>=GW||gy<0||gy>=GH)return;const k=(gy*GW+gx)*3,ri=(m*7+clamp(l|0,0,6))*3;GACC[k]+=RAMPRGB[ri]*g;GACC[k+1]+=RAMPRGB[ri+1]*g;GACC[k+2]+=RAMPRGB[ri+2]*g}
function wp(wx,wy,m,l){const sx=Math.floor(wx)-ox,sy=Math.floor(wy)-oy;if(sx>=0&&sx<W&&sy>=0&&sy<H)out[sy*W+sx]=RC(m,l)}
function we(wx,wy,m,l,g=0.5){const sx=Math.floor(wx)-ox,sy=Math.floor(wy)-oy;if(sx>=0&&sx<W&&sy>=0&&sy<H){out[sy*W+sx]=RC(m,l);glowAdd(sx,sy,m,l,g)}}
const onScreen=(x,y,m=20)=>x-ox>-m&&x-ox<W+m&&y-oy>-m&&y-oy<H+m;
// 有体积的小球：用光源方向做明暗（伪 3D）
const SUNV=(()=>{const v=[-0.55,-0.5,0.67],l=Math.hypot(...v);return v.map(a=>a/l)})();
function ball(cx,cy,r,m,base,sh,emit=0,alpha=1){const R=Math.ceil(r);
 for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const d2=dx*dx+dy*dy;if(d2>r*r)continue;const sx=Math.floor(cx)+dx-ox,sy=Math.floor(cy)+dy-oy;if(sx<0||sx>=W||sy<0||sy>=H)continue;
  if(alpha<1&&bay(sx,sy)>alpha)continue;
  const nx=dx/r,ny=dy/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));const L=nx*SUNV[0]+ny*SUNV[1]+nz*SUNV[2];
  const l=Math.floor(base+(L-0.55)*3.2+bay(sx,sy)-0.5)+sh;out[sy*W+sx]=RC(m,l);if(emit)glowAdd(sx,sy,m,l,emit)}}

// ================= 声音（WebAudio 程序化） =================
let AC=null,MG=null,muted=false,AMBG=null,TIDEG=null,duckK=1;
function ensureAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0.55;MG.connect(AC.destination);startAmb()}catch(e){AC=null}}
function tone(f,d,type='sine',v=0.12,f2=null,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.05)}
let NBUF=null;
function noise(d,v,fc=1200,q=1,delay=0,type='bandpass'){if(!AC||muted)return;if(!NBUF){NBUF=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NBUF.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NBUF;f.type=type;f.frequency.value=fc;f.Q.value=q;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*0.5);s.stop(t+d+0.05)}
function startAmb(){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;AMBG=AC.createGain();AMBG.gain.value=0.05;lp.connect(AMBG);AMBG.connect(MG);
 [55,82.4,110.2,164.8].forEach((f,i)=>{const o=AC.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*6;const g=AC.createGain();g.gain.value=i>1?0.35:0.8;o.connect(g);g.connect(lp);o.start();
  const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=0.05+i*0.03;lg.gain.value=0.3;lf.connect(lg);lg.connect(g.gain);lf.start()});
 TIDEG=AC.createGain();TIDEG.gain.value=0;TIDEG.connect(MG);const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=36.7;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=160;o.connect(f);f.connect(TIDEG);o.start();
 const o2=AC.createOscillator();o2.type='sawtooth';o2.frequency.value=38.1;o2.connect(f);o2.start()}
const PENTA=[523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5];let chimeI=0,chimeT=0;
const SFX={

// ---- 小行星：逐像素可破坏，法线由距离场算出 ----
let rocks=[];const GRID=new Map(),GC=64;
const gkey=(gx,gy)=>(gx+100)*1000+(gy+100);
function gridAdd(r){for(let gy=Math.floor((r.y-r.c)/GC);gy<=Math.floor((r.y+r.c)/GC);gy++)for(let gx=Math.floor((r.x-r.c)/GC);gx<=Math.floor((r.x+r.c)/GC);gx++){const k=gkey(gx,gy);let a=GRID.get(k);if(!a){a=[];GRID.set(k,a)}a.push(r)}}
function gridDel(r){for(const a of GRID.values()){const i=a.indexOf(r);if(i>=0)a.splice(i,1)}}
function rockAt(x,y){const a=GRID.get(gkey(Math.floor(x/GC),Math.floor(y/GC)));if(!a)return null;
 for(const r of a){const i=Math.floor(x)-r.x0,j=Math.floor(y)-r.y0;if(i<0||j<0||i>=r.S||j>=r.S)continue;if(r.m[j*r.S+i])return r}return null}
function makeRock(x,y,R,zone){
 const c=R+3,S=2*c+1,m=new Uint8Array(S*S),alb=new Float32Array(S*S);const sx=R0()*100,sy=R0()*100;
 const oreP=zone==='nursery'?0.95:zone==='leech'?0.96:0.968,embP=zone==='drift'?0.8:zone==='shallow'?0.82:0.86;
 let cnt=0;
 for(let j=0;j<S;j++)for(let i=0;i<S;i++){const dx=i-c,dy=j-c,d=Math.hypot(dx,dy);if(d>R+1.5)continue;
  const ux=d?dx/d:1,uy=d?dy/d:0;const rad=Math.min(R+1,R*(0.74+0.34*n2(ux*1.3+sx,uy*1.3+sy)+0.1*n2(ux*4+sx,uy*4+sy)));
  if(d>=rad)continue;const wx=x+dx,wy=y+dy;let v=1;
  const vein=1-Math.abs(2*fbm(wx*0.09+sx,wy*0.09)-1);if(vein>oreP&&n2(wx*0.08,wy*0.08+sy)>0.45)v=2;
  if(v===1&&n2(wx*0.17+sy,wy*0.17)>embP+0.1*(1-d/rad)&&d<rad-1.5)v=3;
